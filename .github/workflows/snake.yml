name: Generate Snake Animation

on:
  # Refresh twice a day so the graph stays current
  schedule:
    - cron: "0 */12 * * *"
  # Allow running it by hand from the Actions tab
  workflow_dispatch:
  # Regenerate whenever the profile repo itself changes
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render contribution grid as a snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#7C3AED&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#C4B5FD

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
